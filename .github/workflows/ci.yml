name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Quick Benchmark (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'dependencies/requirements.txt'

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Linux Build Toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libomp-dev gcc g++

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dependencies/requirements.txt

      - name: Run Unit Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Run Quick Benchmark Suite
        run: |
          python run_all.py --quick

      - name: Verify Output Artifacts
        shell: bash
        run: |
          test -f output/REPORT.md || exit 1
          test -f output/raw_data/benchmark_results.json || exit 1
          test -f output/raw_data/benchmark_results.csv || exit 1
          ls -la output/charts/
          ls -la output/images/

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            output/REPORT.md
            output/raw_data/
            output/charts/
            output/images/
            output/run.log
          retention-days: 14
